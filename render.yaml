services:
  - type: web
    name: Taqwa
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: misbahul-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: misbahul-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: misbahul-db
          property: password
      - key: WEATHER_API_KEY
        sync: false
databases:
  - name: misbahul-db
    plan: free
    databaseName: misbahul_db
