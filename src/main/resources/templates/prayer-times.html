<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout(~{::title}, ~{::content}, ~{::styles}, ~{::scripts})}">

<head>
    <title th:text="'Namoz Vaqtlari: ' + ${city} + ' | Misbahul.uz'">Namoz Vaqtlari</title>
    <th:block th:fragment="styles">
        <style>
            .prayer-row {
                background: white;
                border: 1px solid #f1f5f9;
                border-radius: 16px;
                padding: 1.5rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1rem;
                transition: all 0.3s;
            }

            .prayer-row:hover {
                border-color: #1e5b53;
                background: #f0fdf4;
                transform: translateX(10px);
            }

            .prayer-row.active {
                background: #1e5b53;
                color: white;
                box-shadow: 0 10px 20px rgba(30, 91, 83, 0.2);
            }

            .prayer-row.active .text-gray-500 {
                color: rgba(255, 255, 255, 0.7);
            }
        </style>
    </th:block>
</head>

<body>
    <div th:fragment="content">
        <div class="container mx-auto px-4 py-12">
            <div class="max-w-2xl mx-auto">
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-bold text-[#1e5b53] mb-2">Namoz Vaqtlari</h1>
                    <p class="text-gray-500"
                        th:text="${city} + ' - ' + ${#temporals.format(#temporals.createNow(), 'dd.MM.yyyy')}">
                    </p>
                    <div class="inline-block mt-4 bg-[#c5a059]/10 text-[#c5a059] px-4 py-1 rounded-full font-bold"
                         th:if="${prayerTimes != null and prayerTimes.data != null and prayerTimes.data.date != null and prayerTimes.data.date.hijri != null}">
                        <span
                            th:text="${prayerTimes.data.date.hijri.day} + ' ' + ${prayerTimes.data.date.hijri.month.en} + ' ' + ${prayerTimes.data.date.hijri.year} + ' H.'">Sana</span>
                    </div>
                </div>

                <!-- API xatolik xabari -->
                <div th:if="${prayerTimes == null}" class="text-center py-12">
                    <i class="bi bi-exclamation-triangle text-5xl text-orange-400 mb-4"></i>
                    <h3 class="text-xl font-bold text-gray-600 mb-2">Namoz vaqtlarini yuklashda xatolik</h3>
                    <p class="text-gray-400">Internetga ulanishni tekshiring yoki qaytadan urinib ko'ring.</p>
                    <a href="/prayer-times" class="mt-4 inline-block bg-[#1e5b53] text-white px-6 py-2 rounded-xl font-bold hover:opacity-90 transition">
                        <i class="bi bi-arrow-repeat me-2"></i>Qayta yuklash
                    </a>
                </div>

                <div class="space-y-4" th:if="${prayerTimes != null and prayerTimes.data != null}">
                    <div class="prayer-row" id="p-fajr">
                        <div class="flex items-center gap-4">
                            <i class="bi bi-brightness-alt-high text-xl"></i>
                            <div>
                                <div class="font-bold">Bomdod</div>
                                <div class="text-xs text-gray-500">Fajr</div>
                            </div>
                        </div>
                        <div class="text-2xl font-black" th:text="${prayerTimes.data.timings.Fajr}">--:--</div>
                    </div>

                    <div class="prayer-row" id="p-sunrise">
                        <div class="flex items-center gap-4">
                            <i class="bi bi-sun text-xl"></i>
                            <div>
                                <div class="font-bold">Quyosh</div>
                                <div class="text-xs text-gray-500">Sunrise</div>
                            </div>
                        </div>
                        <div class="text-2xl font-black" th:text="${prayerTimes.data.timings.Sunrise}">--:--</div>
                    </div>

                    <div class="prayer-row" id="p-dhuhr">
                        <div class="flex items-center gap-4">
                            <i class="bi bi-brightness-high text-xl"></i>
                            <div>
                                <div class="font-bold">Peshin</div>
                                <div class="text-xs text-gray-500">Dhuhr</div>
                            </div>
                        </div>
                        <div class="text-2xl font-black" th:text="${prayerTimes.data.timings.Dhuhr}">--:--</div>
                    </div>

                    <div class="prayer-row" id="p-asr">
                        <div class="flex items-center gap-4">
                            <i class="bi bi-cloud-sun text-xl"></i>
                            <div>
                                <div class="font-bold">Asr</div>
                                <div class="text-xs text-gray-500">Asr</div>
                            </div>
                        </div>
                        <div class="text-2xl font-black" th:text="${prayerTimes.data.timings.Asr}">--:--</div>
                    </div>

                    <div class="prayer-row" id="p-maghrib">
                        <div class="flex items-center gap-4">
                            <i class="bi bi-moon-stars text-xl"></i>
                            <div>
                                <div class="font-bold">Shom</div>
                                <div class="text-xs text-gray-500">Maghrib</div>
                            </div>
                        </div>
                        <div class="text-2xl font-black" th:text="${prayerTimes.data.timings.Maghrib}">--:--</div>
                    </div>

                    <div class="prayer-row" id="p-isha">
                        <div class="flex items-center gap-4">
                            <i class="bi bi-moon-fill text-xl"></i>
                            <div>
                                <div class="font-bold">Xufton</div>
                                <div class="text-xs text-gray-500">Isha</div>
                            </div>
                        </div>
                        <div class="text-2xl font-black" th:text="${prayerTimes.data.timings.Isha}">--:--</div>
                    </div>
                </div>

                <div class="anti-gravity mt-8 p-6 text-center border-dashed border-2"
                     th:if="${prayerTimes != null and prayerTimes.data != null}">
                    <p class="text-sm text-gray-400 mb-1">Keyingi namozga qolgan vaqt:</p>
                    <div id="page-countdown" class="text-5xl font-black text-[#1e5b53]">--:--:--</div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:fragment="scripts">
        <script th:inline="javascript">
            const timings = /*[[${prayerTimes != null && prayerTimes.data != null ? prayerTimes.data.timings : null}]]*/ null;

            function updateActive() {
                if (!timings) return;
                const now = new Date();
                const curMinutes = now.getHours() * 60 + now.getMinutes();

                const rows = document.querySelectorAll('.prayer-row');
                rows.forEach(r => r.classList.remove('active'));

                const prayers = [
                    { id: 'p-fajr', time: timings.Fajr },
                    { id: 'p-sunrise', time: timings.Sunrise },
                    { id: 'p-dhuhr', time: timings.Dhuhr },
                    { id: 'p-asr', time: timings.Asr },
                    { id: 'p-maghrib', time: timings.Maghrib },
                    { id: 'p-isha', time: timings.Isha }
                ].filter(p => p.time);

                let activeId = null;

                const parsed = prayers.map(p => {
                    const [h, m] = p.time.split(':').map(Number);
                    return { id: p.id, minutes: h * 60 + m };
                });

                for (let i = parsed.length - 1; i >= 0; i--) {
                    if (curMinutes >= parsed[i].minutes) {
                        activeId = parsed[i].id;
                        break;
                    }
                }

                if (!activeId) activeId = 'p-isha';

                const activeRow = document.getElementById(activeId);
                if (activeRow) activeRow.classList.add('active');
            }

            function startTimer() {
                if (!timings) return;
                const prayers = [
                    { name: 'Bomdod', time: timings.Fajr },
                    { name: 'Peshin', time: timings.Dhuhr },
                    { name: 'Asr', time: timings.Asr },
                    { name: 'Shom', time: timings.Maghrib },
                    { name: 'Xufton', time: timings.Isha }
                ].filter(p => p.time);

                if (prayers.length === 0) return;

                setInterval(() => {
                    const now = new Date();
                    let next = null;
                    for (let p of prayers) {
                        const [h, m] = p.time.split(':');
                        const t = new Date(); t.setHours(h, m, 0);
                        if (t > now) { next = { ...p, target: t }; break; }
                    }
                    if (!next) {
                        const [h, m] = prayers[0].time.split(':');
                        const t = new Date(); t.setDate(t.getDate() + 1); t.setHours(h, m, 0);
                        next = { ...prayers[0], target: t };
                    }

                    const diff = next.target - now;
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    document.getElementById('page-countdown').innerText =
                        `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }, 1000);
            }
            window.onload = () => {
                updateActive();
                startTimer();
                setInterval(updateActive, 60000);
            };
        </script>
    </th:block>
</body>

</html>
